<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d10;
    --surface: #14161b;
    --surface-2: #1a1d23;
    --surface-3: #22252c;
    --line: rgba(255,255,255,.06);
    --line-2: rgba(255,255,255,.1);
    --text: #ece8e1;
    --muted: #8d8a84;
    --faint: #5c5a56;
    --gold: #c9a86a;
    --gold-2: #e6cf9f;
    --gold-soft: rgba(201,168,106,.12);
    --income: #8fbfa8;
    --expense: #e0907f;
    --radius: 18px;
    --serif: "Cormorant Garamond", "Noto Serif KR", serif;
    --serif-kr: "Noto Serif KR", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); min-height: 100vh;
    background:
      radial-gradient(1000px 500px at 85% -10%, rgba(201,168,106,.08), transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(143,191,168,.04), transparent 60%),
      var(--bg);
    font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
  }
  button, input, select { font-family: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .lc { width: 18px; height: 18px; stroke-width: 1.6; flex-shrink: 0; }
  .app { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 36px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid rgba(201,168,106,.5); color: var(--gold); font-family: var(--serif); font-size: 22px; font-weight: 600;
    background: radial-gradient(circle at 30% 25%, rgba(201,168,106,.18), transparent 70%); }
  .brand .name { font-family: var(--serif-kr); font-size: 24px; font-weight: 600; letter-spacing: .02em; }
  .brand .slogan { font-size: 12px; margin-top: 3px; color: var(--gold); letter-spacing: .08em; }
  .month-nav { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line-2); border-radius: 99px; padding: 4px; background: rgba(20,22,27,.6); backdrop-filter: blur(8px); }
  .month-nav span { min-width: 132px; text-align: center; font-family: var(--serif-kr); font-weight: 500; font-size: 15px; letter-spacing: .04em; }
  .icon-btn { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); transition: .2s; }
  .icon-btn:hover { background: var(--surface-3); color: var(--gold); }

  /* Grid */
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  @media (max-width: 940px) { .grid { grid-template-columns: 1fr; } }

  .card { background: linear-gradient(180deg, rgba(255,255,255,.02), transparent 40%), var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 22px; }
  .card-title .t { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .card-title h2 { margin: 0; font-family: var(--serif-kr); font-size: 18px; font-weight: 500; letter-spacing: .01em; }
  .card-title small { font-weight: 400; color: var(--muted); font-size: 12.5px; }

  /* Hero — black card */
  .hero { position: relative; overflow: hidden; padding: 30px 28px 26px; border: 1px solid rgba(201,168,106,.28);
    background:
      radial-gradient(420px 220px at 100% 0%, rgba(201,168,106,.22), transparent 70%),
      linear-gradient(150deg, #1d1f25 0%, #121317 60%, #0e0f12 100%); }
  .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px); }
  .hero .top { display: flex; justify-content: space-between; align-items: center; }
  .hero .label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .hero .mark { font-family: var(--serif); font-style: italic; color: rgba(230,207,159,.6); font-size: 15px; }
  .hero .balance { font-family: var(--serif); font-size: 46px; font-weight: 600; margin: 18px 0 26px; letter-spacing: -0.01em; line-height: 1;
    background: linear-gradient(180deg, #fff6e4, #d8bd88); -webkit-background-clip: text; background-clip: text; color: transparent; word-break: break-all; }
  .hero .balance .unit { font-family: var(--serif-kr); font-size: 20px; margin-left: 4px; }
  .hero .split { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(201,168,106,.18); padding-top: 18px; }
  .hero .split > div + div { border-left: 1px solid rgba(201,168,106,.18); padding-left: 18px; }
  .hero .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .hero .k i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .hero .v { font-size: 17px; font-weight: 600; margin-top: 6px; }

  /* Form */
  .segment { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-2); border-radius: 99px; padding: 4px; margin-bottom: 24px; }
  .segment button { border: 0; background: transparent; padding: 9px; border-radius: 99px; font-weight: 500; font-size: 14px; cursor: pointer; color: var(--muted); transition: .2s; letter-spacing: .04em; }
  .segment button.on { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
  .segment button.on[data-type="expense"] { color: var(--expense); }
  .segment button.on[data-type="income"] { color: var(--income); }

  .amount-box { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line-2); padding: 0 2px 12px; margin-bottom: 26px; transition: border-color .2s; }
  .amount-box:focus-within { border-color: var(--gold); }
  .amount-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: var(--serif); font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .amount-box span { font-family: var(--serif-kr); font-size: 18px; color: var(--muted); }
  .amount-box input::placeholder { color: var(--faint); }

  .field-label { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  .cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 24px; }
  .cat-btn { border: 1px solid var(--line); background: transparent; border-radius: 14px; padding: 12px 2px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); transition: .2s; }
  .cat-btn .lc { width: 20px; height: 20px; color: var(--muted); transition: .2s; }
  .cat-btn:hover { border-color: var(--line-2); color: var(--text); }
  .cat-btn.on { border-color: color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); color: var(--text); }
  .cat-btn.on .lc { color: color-mix(in srgb, var(--c) 70%, white); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .input { width: 100%; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 12px; font-size: 14px; background: var(--surface-2); outline: 0; transition: border-color .2s; }
  .input:focus { border-color: var(--gold); }
  .input::placeholder { color: var(--faint); }
  .submit { width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 600; letter-spacing: .08em; color: #1a1408; cursor: pointer;
    background: linear-gradient(180deg, #e8d3a6, #c4a163); box-shadow: 0 10px 30px -10px rgba(201,168,106,.55), inset 0 1px 0 rgba(255,255,255,.4); transition: .2s; }
  .submit:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .submit:disabled { opacity: .6; cursor: wait; }

  /* Weekly */
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 2px; }
  .weeks { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; height: 200px; align-items: end; }
  .week { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; border-radius: 14px; padding: 12px 4px 10px; transition: .2s; border: 1px solid transparent; background: transparent; }
  .week:hover { background: var(--surface-2); }
  .week.on { background: var(--gold-soft); border-color: rgba(201,168,106,.25); }
  .week .bars { flex: 1; width: 100%; display: flex; justify-content: center; align-items: flex-end; gap: 5px; }
  .week .bar { width: 10px; border-radius: 99px; min-height: 3px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .week .bar.inc { background: linear-gradient(180deg, #b7dccb, var(--income)); }
  .week .bar.exp { background: linear-gradient(180deg, #f0b6a9, var(--expense)); }
  .week .wl { font-family: var(--serif-kr); font-size: 13px; font-weight: 500; }
  .week.on .wl { color: var(--gold-2); }
  .week .wr { font-size: 10.5px; color: var(--faint); margin-top: -6px; }

  .week-detail { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 24px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .stat { padding: 14px 16px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .k { font-size: 11.5px; color: var(--muted); }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 6px; word-break: keep-all; font-variant-numeric: tabular-nums; }
  .up { color: var(--expense); } .down { color: var(--income); }
  @media (max-width: 600px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat:nth-child(3) { border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 130px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .day .track { flex: 1; width: 100%; max-width: 28px; background: var(--surface-2); border-radius: 99px; display: flex; align-items: flex-end; overflow: hidden; }
  .day .fill { width: 100%; background: linear-gradient(180deg, var(--gold-2), var(--gold)); border-radius: 99px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .day .dl { font-size: 11.5px; color: var(--muted); }
  .day.today .dl { color: var(--gold); font-weight: 600; }
  .day.out { opacity: .3; }

  /* Categories */
  .stack { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin-bottom: 22px; background: var(--surface-2); gap: 2px; }
  .stack div { height: 100%; }
  .cat-rows { display: flex; flex-direction: column; gap: 16px; }
  .cat-row { display: flex; align-items: center; gap: 14px; }
  .chip { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
    border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--c) 9%, transparent); color: color-mix(in srgb, var(--c) 70%, white); }
  .cat-row .mid { flex: 1; min-width: 0; }
  .cat-row .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .cat-row .top small { color: var(--faint); margin-left: 8px; }
  .cat-row .top .num { font-weight: 600; }
  .cat-row .track { height: 3px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .cat-row .fill { height: 100%; border-radius: 99px; background: color-mix(in srgb, var(--c) 75%, white); }

  /* List */
  .filter { display: flex; gap: 2px; border: 1px solid var(--line-2); border-radius: 99px; padding: 3px; }
  .filter button { border: 0; background: transparent; border-radius: 99px; padding: 6px 13px; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: .2s; }
  .filter button.on { background: var(--surface-3); color: var(--gold-2); }
  .day-group + .day-group { margin-top: 20px; }
  .day-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 4px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  .day-head span:first-child { font-family: var(--serif-kr); color: var(--text); font-size: 13px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 12px 6px; border-radius: 12px; transition: background .2s; }
  .item:hover { background: var(--surface-2); }
  .item .info { flex: 1; min-width: 0; }
  .item .t { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: 12px; color: var(--faint); margin-top: 3px; }
  .item .amt { font-weight: 600; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .amt.income { color: var(--income); }
  .item .del { opacity: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; transition: .2s; }
  .item .del .lc { width: 15px; height: 15px; }
  .item:hover .del { opacity: 1; }
  .item .del:hover { background: rgba(224,144,127,.12); color: var(--expense); }
  @media (hover: none) { .item .del { opacity: .6; } }

  .empty { text-align: center; color: var(--faint); padding: 34px 0; font-size: 13.5px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .empty .lc { width: 26px; height: 26px; stroke-width: 1.2; color: var(--faint); }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tools button { border: 1px solid var(--line-2); background: transparent; border-radius: 12px; padding: 11px 12px; cursor: pointer; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; transition: .2s; }
  .tools button .lc { width: 15px; height: 15px; }
  .tools button:hover { color: var(--gold-2); border-color: rgba(201,168,106,.4); }
  .tools button.danger:hover { color: var(--expense); border-color: rgba(224,144,127,.4); }
  #syncStatus { display: inline-flex; align-items: center; gap: 6px; }
  #syncStatus::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--income); box-shadow: 0 0 8px var(--income); }

  .toast { position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px); background: rgba(26,29,35,.92); backdrop-filter: blur(10px);
    border: 1px solid rgba(201,168,106,.3); color: var(--text); padding: 13px 20px; border-radius: 99px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: .3s; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { text-align: center; margin-top: 48px; font-family: var(--serif); font-style: italic; color: var(--faint); font-size: 14px; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">₩</div>
      <div><div class="name">가계부</div><div class="slogan">바이브코딩 화이팅! 🔥</div></div>
    </div>
    <div class="month-nav">
      <button class="icon-btn" id="prev" aria-label="이전 달"><i data-lucide="chevron-left" class="lc"></i></button>
      <span id="monthLabel"></span>
      <button class="icon-btn" id="next" aria-label="다음 달"><i data-lucide="chevron-right" class="lc"></i></button>
    </div>
  </header>

  <div class="grid">
    <!-- Left -->
    <div class="col">
      <div class="card hero">
        <div class="top"><div class="label" id="heroLabel">Balance</div><div class="mark">Private Ledger</div></div>
        <div class="balance num" id="sumBalance">0</div>
        <div class="split">
          <div><div class="k"><i style="background:var(--income)"></i>수입</div><div class="v num" id="sumIncome">0원</div></div>
          <div><div class="k"><i style="background:var(--expense)"></i>지출</div><div class="v num" id="sumExpense">0원</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><div class="t"><span class="eyebrow">New Entry</span><h2>내역 추가</h2></div></div>
        <form id="form" autocomplete="off">
          <div class="segment" id="segment">
            <button type="button" data-type="expense" class="on">지출</button>
            <button type="button" data-type="income">수입</button>
          </div>
          <div class="amount-box">
            <input type="text" id="amount" placeholder="0" inputmode="numeric" required>
            <span>원</span>
          </div>
          <div class="field-label">Category</div>
          <div class="cat-grid" id="catGrid"></div>
          <div class="row2">
            <input class="input" type="date" id="date" required>
            <input class="input" type="text" id="memo" placeholder="메모 (선택)" maxlength="40">
          </div>
          <button class="submit" type="submit">추가하기</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title"><div class="t"><span class="eyebrow">Data</span><h2>데이터 관리</h2></div><small id="syncStatus">불러오는 중…</small></div>
        <div class="tools">
          <button id="exportBtn"><i data-lucide="download" class="lc"></i>JSON 백업</button>
          <button id="importBtn"><i data-lucide="upload" class="lc"></i>JSON 불러오기</button>
          <button id="csvBtn"><i data-lucide="file-spreadsheet" class="lc"></i>CSV 내보내기</button>
          <button id="clearBtn" class="danger"><i data-lucide="trash-2" class="lc"></i>전체 삭제</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
      </div>
    </div>

    <!-- Right -->
    <div class="col">
      <div class="card">
        <div class="card-title">
          <div class="t"><span class="eyebrow">Weekly</span><h2>주별 통계</h2></div>
          <span class="legend"><span><i style="background:var(--income)"></i>수입</span><span><i style="background:var(--expense)"></i>지출</span></span>
        </div>
        <div class="weeks" id="weeks"></div>
        <div class="week-detail">
          <div class="stats" id="weekStats"></div>
          <div class="days" id="days"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><div class="t"><span class="eyebrow">Spending</span><h2>카테고리별 지출</h2></div><small id="catTotal" class="num"></small></div>
        <div id="cats"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <div class="t"><span class="eyebrow">History</span><h2>내역</h2></div>
          <span class="filter" id="filter">
            <button data-f="all" class="on">전체</button>
            <button data-f="income">수입</button>
            <button data-f="expense">지출</button>
          </span>
        </div>
        <div id="list"></div>
      </div>
    </div>
  </div>
  <footer>— Spend wisely, live richly —</footer>
</div>
<div class="toast" id="toast"></div>

<script>
// Supabase 설정 (publishable 키는 브라우저 공개용 키예요)
const SUPABASE_URL = 'https://jazfkgxdotdwhzlpcunu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VpFBQVWw60xb1DxoUWSAwQ_9c2WL-Z8';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'entries';
const LOCAL_KEY = 'gagyebu.entries'; // 예전 localStorage 데이터 (이전용)

// l: 라인 아이콘 이름(lucide), i: 아이콘을 못 불러올 때 대신 보여줄 이모지
const CATS = {
  expense: [
    { n: '식비', l: 'utensils', i: '🍚', c: '#e8a56b' },
    { n: '카페', l: 'coffee', i: '☕', c: '#c79a72' },
    { n: '교통', l: 'bus', i: '🚌', c: '#7fb0cf' },
    { n: '주거', l: 'house', i: '🏠', c: '#a99ad6' },
    { n: '통신', l: 'smartphone', i: '📱', c: '#7cc3c9' },
    { n: '쇼핑', l: 'shopping-bag', i: '🛍️', c: '#d993b0' },
    { n: '의료', l: 'pill', i: '💊', c: '#e08f86' },
    { n: '문화', l: 'film', i: '🎬', c: '#9aa3e0' },
    { n: '교육', l: 'book-open', i: '📚', c: '#86c2ac' },
    { n: '기타', l: 'package', i: '📦', c: '#a8a39a' }
  ],
  income: [
    { n: '월급', l: 'briefcase', i: '💼', c: '#c9a86a' },
    { n: '용돈', l: 'gift', i: '🎁', c: '#e3b77b' },
    { n: '부수입', l: 'coins', i: '💸', c: '#8fbfa8' },
    { n: '이자', l: 'landmark', i: '🏦', c: '#86b4c9' },
    { n: '기타', l: 'sparkles', i: '✨', c: '#a8a39a' }
  ]
};
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

const $ = id => document.getElementById(id);
const won = n => n.toLocaleString('ko-KR') + '원';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catInfo = (type, name) => (CATS[type] || CATS.expense).find(c => c.n === name) || { n: name, l: 'package', i: '📦', c: '#a8a39a' };
const icon = (name, fallback = '') => `<i data-lucide="${name}" class="lc">${fallback}</i>`;
function paintIcons() {
  if (window.lucide) lucide.createIcons({ icons: lucide.icons, attrs: { class: 'lc' } });
}

/* ---------- Supabase ---------- */
const COLS = 'id,type,date,category,amount,memo';
const toRow = e => ({
  type: e.type === 'income' ? 'income' : 'expense',
  date: String(e.date).slice(0, 10),
  category: String(e.category || '기타').slice(0, 20),
  amount: Math.round(Number(e.amount)),
  memo: String(e.memo || '').slice(0, 40)
});
const fromRow = r => ({ ...r, amount: Number(r.amount) });

async function fetchAll() {
  const all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await db.from(TABLE).select(COLS).order('date').order('id').range(from, from + 999);
    if (error) throw error;
    all.push(...data.map(fromRow));
    if (data.length < 1000) return all;
  }
}
async function insertMany(list) {
  const rows = list.map(toRow).filter(r => r.amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(r.date));
  const out = [];
  for (let i = 0; i < rows.length; i += 500) {
    const { data, error } = await db.from(TABLE).insert(rows.slice(i, i + 500)).select(COLS);
    if (error) throw error;
    out.push(...data.map(fromRow));
  }
  return out;
}
async function deleteAll() {
  const { error } = await db.from(TABLE).delete().gt('id', 0);
  if (error) throw error;
}
function fail(err) {
  console.error(err);
  toast('저장소 연결에 실패했어요: ' + (err.message || err));
  setStatus('연결 오류', true);
}
function setStatus(text, bad) {
  $('syncStatus').textContent = text;
  $('syncStatus').style.color = bad ? 'var(--expense)' : '';
}

let entries = [];
let viewDate = new Date(); viewDate.setDate(1);
let type = 'expense';
let category = CATS.expense[0].n;
let filter = 'all';
let selectedWeek = null;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- Form ---------- */
function renderCatGrid() {
  $('catGrid').innerHTML = CATS[type].map(c => `
    <button type="button" class="cat-btn ${c.n === category ? 'on' : ''}" data-cat="${c.n}" style="--c:${c.c}">
      ${icon(c.l, c.i)}${c.n}
    </button>`).join('');
  paintIcons();
}
$('segment').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  type = b.dataset.type; category = CATS[type][0].n;
  [...$('segment').children].forEach(x => x.classList.toggle('on', x === b));
  renderCatGrid();
});
$('catGrid').addEventListener('click', e => {
  const b = e.target.closest('.cat-btn'); if (!b) return;
  category = b.dataset.cat; renderCatGrid();
});
$('amount').addEventListener('input', e => {
  const digits = e.target.value.replace(/[^\d]/g, '').replace(/^0+/, '').slice(0, 12);
  e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
});
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const amount = Number($('amount').value.replace(/[^\d]/g, ''));
  if (!amount) { $('amount').focus(); return; }
  const date = $('date').value || ymd(new Date());
  const btn = e.target.querySelector('.submit');
  btn.disabled = true;
  try {
    const [row] = await insertMany([{ type, date, category, amount, memo: $('memo').value.trim() }]);
    entries.push(row);
  } catch (err) { fail(err); return; }
  finally { btn.disabled = false; }
  const d = parse(date);
  viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
  selectedWeek = null;
  $('amount').value = ''; $('memo').value = '';
  render();
  toast(`${category} · ${won(amount)} ${type === 'income' ? '수입' : '지출'}을 기록했어요`);
});

/* ---------- Weeks ---------- */
function weeksOfMonth(first) {
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  let start = addDays(first, -((first.getDay() + 6) % 7)); // 월요일 시작
  const weeks = [];
  while (start <= last) { weeks.push(start); start = addDays(start, 7); }
  return weeks;
}
function sumRange(from, to, t) {
  const a = ymd(from), b = ymd(to);
  return entries.filter(e => e.type === t && e.date >= a && e.date <= b).reduce((s, e) => s + e.amount, 0);
}

function renderWeeks() {
  const weeks = weeksOfMonth(viewDate);
  const todayStr = ymd(new Date());
  if (selectedWeek === null || selectedWeek >= weeks.length) {
    const idx = weeks.findIndex(w => todayStr >= ymd(w) && todayStr <= ymd(addDays(w, 6)));
    selectedWeek = idx >= 0 ? idx : 0;
  }
  const data = weeks.map(w => ({ w, inc: sumRange(w, addDays(w, 6), 'income'), exp: sumRange(w, addDays(w, 6), 'expense') }));
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  $('weeks').innerHTML = data.map((d, i) => {
    const end = addDays(d.w, 6);
    return `<button class="week ${i === selectedWeek ? 'on' : ''}" data-i="${i}">
      <div class="bars">
        <div class="bar inc" style="height:${d.inc / max * 100}%" title="수입 ${won(d.inc)}"></div>
        <div class="bar exp" style="height:${d.exp / max * 100}%" title="지출 ${won(d.exp)}"></div>
      </div>
      <div class="wl">${i + 1}주</div>
      <div class="wr">${d.w.getMonth() + 1}/${d.w.getDate()}–${end.getMonth() + 1}/${end.getDate()}</div>
    </button>`;
  }).join('');

  // 선택 주 상세
  const ws = weeks[selectedWeek], we = addDays(ws, 6);
  const exp = sumRange(ws, we, 'expense'), inc = sumRange(ws, we, 'income');
  const prev = sumRange(addDays(ws, -7), addDays(ws, -1), 'expense');
  let cmp = '<span style="color:var(--faint)">—</span>';
  if (prev > 0) {
    const pct = Math.round((exp - prev) / prev * 100);
    cmp = pct === 0 ? '변동 없음' : `<span class="${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span>`;
  }
  $('weekStats').innerHTML = `
    <div class="stat"><div class="k">${selectedWeek + 1}주차 지출</div><div class="v" style="color:var(--expense)">${won(exp)}</div></div>
    <div class="stat"><div class="k">${selectedWeek + 1}주차 수입</div><div class="v" style="color:var(--income)">${won(inc)}</div></div>
    <div class="stat"><div class="k">하루 평균 지출</div><div class="v">${won(Math.round(exp / 7))}</div></div>
    <div class="stat"><div class="k">지난주 대비</div><div class="v">${cmp}</div></div>`;

  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const dayExp = days.map(d => sumRange(d, d, 'expense'));
  const dmax = Math.max(1, ...dayExp);
  $('days').innerHTML = days.map((d, i) => `
    <div class="day ${ymd(d) === todayStr ? 'today' : ''} ${d.getMonth() !== viewDate.getMonth() ? 'out' : ''}" title="${d.getMonth() + 1}/${d.getDate()} 지출 ${won(dayExp[i])}">
      <div class="track"><div class="fill" style="height:${dayExp[i] / dmax * 100}%"></div></div>
      <div class="dl">${DOW[d.getDay()]} ${d.getDate()}</div>
    </div>`).join('');
}
$('weeks').addEventListener('click', e => {
  const b = e.target.closest('.week'); if (!b) return;
  selectedWeek = Number(b.dataset.i); renderWeeks();
});

/* ---------- Main render ---------- */
function render() {
  const mk = `${viewDate.getFullYear()}-${pad(viewDate.getMonth() + 1)}`;
  $('monthLabel').textContent = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
  $('heroLabel').textContent = `Balance · ${viewDate.getMonth() + 1}월`;

  const month = entries.filter(e => e.date.startsWith(mk));
  const inc = month.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const exp = month.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  const bal = inc - exp;
  $('sumIncome').textContent = won(inc);
  $('sumExpense').textContent = won(exp);
  $('sumBalance').innerHTML = `${bal < 0 ? '−' : ''}${Math.abs(bal).toLocaleString('ko-KR')}<span class="unit">원</span>`;

  renderWeeks();

  // 카테고리
  const by = {};
  month.filter(e => e.type === 'expense').forEach(e => by[e.category] = (by[e.category] || 0) + e.amount);
  const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
  $('catTotal').textContent = exp ? `총 ${won(exp)}` : '';
  $('cats').innerHTML = cats.length ? `
    <div class="stack">${cats.map(([n, v]) => `<div style="width:${v / exp * 100}%;background:${catInfo('expense', n).c}" title="${esc(n)}"></div>`).join('')}</div>
    <div class="cat-rows">${cats.map(([n, v]) => { const c = catInfo('expense', n); return `
      <div class="cat-row" style="--c:${c.c}">
        <div class="chip">${icon(c.l, c.i)}</div>
        <div class="mid">
          <div class="top"><span>${esc(n)}<small>${Math.round(v / exp * 100)}%</small></span><span class="num">${won(v)}</span></div>
          <div class="track"><div class="fill" style="width:${v / cats[0][1] * 100}%"></div></div>
        </div>
      </div>`; }).join('')}</div>`
    : `<div class="empty">${icon('chart-pie')}이번 달 지출 내역이 없어요</div>`;

  // 내역 (날짜별 그룹)
  const shown = month.filter(e => filter === 'all' || e.type === filter)
    .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const groups = {};
  shown.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  $('list').innerHTML = shown.length ? Object.entries(groups).map(([date, items]) => {
    const d = parse(date);
    const net = items.reduce((s, e) => s + (e.type === 'income' ? e.amount : -e.amount), 0);
    return `<div class="day-group">
      <div class="day-head"><span>${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</span><span class="num">${net >= 0 ? '+' : '−'}${won(Math.abs(net))}</span></div>
      ${items.map(e => { const c = catInfo(e.type, e.category); return `
        <div class="item">
          <div class="chip" style="--c:${c.c}">${icon(c.l, c.i)}</div>
          <div class="info"><div class="t">${esc(e.memo || e.category)}</div><div class="s">${esc(e.category)}</div></div>
          <div class="amt ${e.type}">${e.type === 'income' ? '+' : '−'}${won(e.amount)}</div>
          <button class="del" data-id="${e.id}" title="삭제">${icon('x', '✕')}</button>
        </div>`; }).join('')}
    </div>`;
  }).join('') : `<div class="empty">${icon('scroll-text')}내역이 없어요</div>`;

  paintIcons();
}

$('filter').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('filter').children].forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('list').addEventListener('click', async e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirm('이 내역을 삭제할까요?')) return;
  const id = Number(b.dataset.id);
  const { error } = await db.from(TABLE).delete().eq('id', id);
  if (error) return fail(error);
  entries = entries.filter(x => x.id !== id);
  render(); toast('삭제했어요');
});
$('prev').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() - 1); selectedWeek = null; render(); });
$('next').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() + 1); selectedWeek = null; render(); });

/* ---------- Data tools ---------- */
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('exportBtn').addEventListener('click', () => download(`가계부_${ymd(new Date())}.json`, JSON.stringify(entries, null, 2), 'application/json'));
$('csvBtn').addEventListener('click', () => {
  const rows = [['날짜', '구분', '카테고리', '금액', '메모']].concat(
    [...entries].sort((a, b) => a.date.localeCompare(b.date))
      .map(e => [e.date, e.type === 'income' ? '수입' : '지출', e.category, e.amount, `"${(e.memo || '').replace(/"/g, '""')}"`]));
  download(`가계부_${ymd(new Date())}.csv`, '﻿' + rows.map(r => r.join(',')).join('\n'), 'text/csv');
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    if (!confirm(`${data.length}건을 불러옵니다. 기존 데이터는 대체돼요. 계속할까요?`)) return;
    await deleteAll();
    entries = await insertMany(data);
    render(); toast('불러오기 완료');
  } catch (err) {
    if (err instanceof SyntaxError || err === 0) alert('올바른 가계부 JSON 파일이 아니에요.');
    else fail(err);
  }
  finally { e.target.value = ''; }
});
$('clearBtn').addEventListener('click', async () => {
  if (!confirm('모든 내역을 삭제할까요? 되돌릴 수 없어요.')) return;
  try { await deleteAll(); } catch (err) { return fail(err); }
  entries = []; render(); toast('전체 삭제했어요');
});

// 예전에 이 브라우저(localStorage)에 저장한 내역이 있으면 한 번 옮겨 줌
async function migrateLocal() {
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch {}
  if (!Array.isArray(local) || !local.length) return;
  if (!confirm(`이 브라우저에 저장된 예전 내역 ${local.length}건이 있어요. 서버로 옮길까요?`)) return;
  entries.push(...await insertMany(local));
  try { localStorage.removeItem(LOCAL_KEY); } catch {}
  toast(`${local.length}건을 옮겼어요`);
}

async function init() {
  $('date').value = ymd(new Date());
  renderCatGrid();
  render();
  try {
    entries = await fetchAll();
    await migrateLocal();
    setStatus('Supabase에 저장돼요');
  } catch (err) { fail(err); }
  render();
}
init();
</script>
</body>
</html>
