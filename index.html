<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #f4f5f9;
    --surface: #ffffff;
    --surface-2: #f7f8fb;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e9ecf2;
    --brand: #6d5efc;
    --brand-soft: #eeecff;
    --income: #3b82f6;
    --expense: #f43f5e;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d14; --surface: #151824; --surface-2: #1c2030; --text: #e8eaf2; --muted: #8b93a7;
      --line: #252a3b; --brand: #8b7fff; --brand-soft: #24224a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  button, input, select { font-family: inherit; color: inherit; }
  .app { max-width: 1160px; margin: 0 auto; padding: 28px 20px 60px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; }
  .brand .slogan { font-size: 13px; font-weight: 700; margin-top: 2px; letter-spacing: 0;
    background: linear-gradient(90deg, #8b7fff, #f43f5e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px;
    background: linear-gradient(135deg, #8b7fff, #6d5efc); color: #fff; box-shadow: 0 6px 16px rgba(109,94,252,.35); }
  .month-nav { display: flex; align-items: center; gap: 4px; background: var(--surface); padding: 6px; border-radius: 14px; box-shadow: var(--shadow); }
  .month-nav span { min-width: 120px; text-align: center; font-weight: 700; font-size: 16px; }
  .icon-btn { width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-size: 18px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--surface-2); }

  /* Grid */
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .card-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; font-size: 16px; font-weight: 700; }
  .card-title small { font-weight: 500; color: var(--muted); font-size: 13px; }

  /* Hero balance */
  .hero { background: linear-gradient(140deg, #7c6dff 0%, #5b4cf0 55%, #4636d8 100%); color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .hero .label { opacity: .8; font-size: 14px; }
  .hero .balance { font-size: 34px; font-weight: 800; margin: 6px 0 20px; letter-spacing: -0.03em; }
  .hero .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hero .pill { background: rgba(255,255,255,.14); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(4px); }
  .hero .pill .k { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 6px; }
  .hero .pill .v { font-size: 17px; font-weight: 700; margin-top: 4px; }

  /* Form */
  .segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .segment button { border: 0; background: transparent; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; color: var(--muted); transition: .15s; }
  .segment button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .segment button.on[data-type="expense"] { color: var(--expense); }
  .segment button.on[data-type="income"] { color: var(--income); }

  .amount-box { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding: 4px 2px 10px; margin-bottom: 18px; transition: border-color .15s; }
  .amount-box:focus-within { border-color: var(--brand); }
  .amount-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
  .amount-box span { font-size: 20px; font-weight: 700; color: var(--muted); }
  .amount-box input::placeholder { color: var(--line); }

  .field-label { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px; }
  .cat-btn { border: 1.5px solid transparent; background: var(--surface-2); border-radius: 14px; padding: 10px 2px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); transition: .15s; }
  .cat-btn .ic { font-size: 22px; line-height: 1; }
  .cat-btn:hover { transform: translateY(-1px); }
  .cat-btn.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); color: var(--text); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; background: var(--surface); outline: 0; transition: border-color .15s; }
  .input:focus { border-color: var(--brand); }
  .submit { width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; background: var(--brand); box-shadow: 0 8px 20px rgba(109,94,252,.3); transition: .15s; }
  .submit:hover { transform: translateY(-1px); }
  .submit:active { transform: translateY(0); }

  /* Weekly */
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 5px; vertical-align: 1px; }
  .weeks { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; height: 190px; align-items: end; }
  .week { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; border-radius: 14px; padding: 10px 4px 8px; transition: background .15s; border: 0; background: transparent; }
  .week:hover { background: var(--surface-2); }
  .week.on { background: var(--brand-soft); }
  .week .bars { flex: 1; width: 100%; display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
  .week .bar { width: 14px; border-radius: 6px 6px 3px 3px; min-height: 3px; transition: height .4s cubic-bezier(.2,.8,.2,1); }
  .week .bar.inc { background: var(--income); }
  .week .bar.exp { background: var(--expense); }
  .week .wl { font-size: 13px; font-weight: 700; }
  .week .wr { font-size: 11px; color: var(--muted); margin-top: -6px; }

  .week-detail { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat .v { font-size: 16px; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; word-break: keep-all; }
  .up { color: var(--expense); } .down { color: #10b981; }
  @media (max-width: 560px) { .stats { grid-template-columns: 1fr 1fr; } }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 120px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .day .track { flex: 1; width: 100%; max-width: 34px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
  .day .fill { width: 100%; background: linear-gradient(180deg, #fb7185, var(--expense)); border-radius: 8px; transition: height .4s cubic-bezier(.2,.8,.2,1); }
  .day .dl { font-size: 12px; color: var(--muted); font-weight: 600; }
  .day.today .dl { color: var(--brand); }
  .day.out { opacity: .35; }

  /* Categories */
  .stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin-bottom: 16px; background: var(--surface-2); }
  .stack div { height: 100%; }
  .cat-rows { display: flex; flex-direction: column; gap: 12px; }
  .cat-row { display: flex; align-items: center; gap: 12px; }
  .chip { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; background: color-mix(in srgb, var(--c) 15%, var(--surface)); }
  .cat-row .mid { flex: 1; min-width: 0; }
  .cat-row .top { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .cat-row .top small { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .cat-row .track { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .cat-row .fill { height: 100%; border-radius: 99px; background: var(--c); }

  /* List */
  .filter { display: flex; gap: 6px; }
  .filter button { border: 0; background: var(--surface-2); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .filter button.on { background: var(--text); color: var(--surface); }
  .day-group + .day-group { margin-top: 14px; }
  .day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 4px 6px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-radius: 14px; transition: background .15s; }
  .item:hover { background: var(--surface-2); }
  .item .info { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .amt { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .amt.income { color: var(--income); }
  .item .del { opacity: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; width: 28px; height: 28px; border-radius: 8px; }
  .item:hover .del { opacity: 1; }
  .item .del:hover { background: color-mix(in srgb, var(--expense) 12%, transparent); color: var(--expense); }
  @media (hover: none) { .item .del { opacity: .6; } }

  .empty { text-align: center; color: var(--muted); padding: 28px 0; font-size: 14px; }
  .empty .e { font-size: 32px; margin-bottom: 6px; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button { border: 1.5px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tools button:hover { color: var(--text); border-color: var(--muted); }
  .tools button.danger:hover { color: var(--expense); border-color: var(--expense); }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--text); color: var(--surface); padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">₩</div><div>가계부<div class="slogan">바이브코딩 화이팅! 🔥</div></div></div>
    <div class="month-nav">
      <button class="icon-btn" id="prev" aria-label="이전 달">‹</button>
      <span id="monthLabel"></span>
      <button class="icon-btn" id="next" aria-label="다음 달">›</button>
    </div>
  </header>

  <div class="grid">
    <!-- Left -->
    <div class="col">
      <div class="card hero">
        <div class="label" id="heroLabel">이번 달 잔액</div>
        <div class="balance" id="sumBalance">0원</div>
        <div class="split">
          <div class="pill"><div class="k">↓ 수입</div><div class="v" id="sumIncome">0원</div></div>
          <div class="pill"><div class="k">↑ 지출</div><div class="v" id="sumExpense">0원</div></div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">내역 추가</h2>
        <form id="form" autocomplete="off">
          <div class="segment" id="segment">
            <button type="button" data-type="expense" class="on">지출</button>
            <button type="button" data-type="income">수입</button>
          </div>
          <div class="amount-box">
            <input type="text" id="amount" placeholder="0" inputmode="numeric" required>
            <span>원</span>
          </div>
          <div class="field-label">카테고리</div>
          <div class="cat-grid" id="catGrid"></div>
          <div class="row2">
            <input class="input" type="date" id="date" required>
            <input class="input" type="text" id="memo" placeholder="메모 (선택)" maxlength="40">
          </div>
          <button class="submit" type="submit">추가하기</button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">데이터 관리 <small id="syncStatus">불러오는 중…</small></h2>
        <div class="tools">
          <button id="exportBtn">JSON 백업</button>
          <button id="importBtn">JSON 불러오기</button>
          <button id="csvBtn">CSV 내보내기</button>
          <button id="clearBtn" class="danger">전체 삭제</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
      </div>
    </div>

    <!-- Right -->
    <div class="col">
      <div class="card">
        <h2 class="card-title">주별 통계
          <span class="legend"><span><i style="background:var(--income)"></i>수입</span><span><i style="background:var(--expense)"></i>지출</span></span>
        </h2>
        <div class="weeks" id="weeks"></div>
        <div class="week-detail">
          <div class="stats" id="weekStats"></div>
          <div class="days" id="days"></div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">카테고리별 지출 <small id="catTotal"></small></h2>
        <div id="cats"></div>
      </div>

      <div class="card">
        <h2 class="card-title">내역
          <span class="filter" id="filter">
            <button data-f="all" class="on">전체</button>
            <button data-f="income">수입</button>
            <button data-f="expense">지출</button>
          </span>
        </h2>
        <div id="list"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Supabase 설정 (publishable 키는 브라우저 공개용 키예요)
const SUPABASE_URL = 'https://jazfkgxdotdwhzlpcunu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VpFBQVWw60xb1DxoUWSAwQ_9c2WL-Z8';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'entries';
const LOCAL_KEY = 'gagyebu.entries'; // 예전 localStorage 데이터 (이전용)

const CATS = {
  expense: [
    { n: '식비', i: '🍚', c: '#f97316' },
    { n: '카페', i: '☕', c: '#b45309' },
    { n: '교통', i: '🚌', c: '#0ea5e9' },
    { n: '주거', i: '🏠', c: '#8b5cf6' },
    { n: '통신', i: '📱', c: '#06b6d4' },
    { n: '쇼핑', i: '🛍️', c: '#ec4899' },
    { n: '의료', i: '💊', c: '#ef4444' },
    { n: '문화', i: '🎬', c: '#6366f1' },
    { n: '교육', i: '📚', c: '#14b8a6' },
    { n: '기타', i: '📦', c: '#64748b' }
  ],
  income: [
    { n: '월급', i: '💼', c: '#2563eb' },
    { n: '용돈', i: '🎁', c: '#f59e0b' },
    { n: '부수입', i: '💸', c: '#10b981' },
    { n: '이자', i: '🏦', c: '#0891b2' },
    { n: '기타', i: '✨', c: '#64748b' }
  ]
};
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

const $ = id => document.getElementById(id);
const won = n => n.toLocaleString('ko-KR') + '원';
const shortWon = n => n >= 10000 ? (Math.round(n / 1000) / 10).toLocaleString('ko-KR') + '만' : n.toLocaleString('ko-KR');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catInfo = (type, name) => (CATS[type] || CATS.expense).find(c => c.n === name) || { n: name, i: '📦', c: '#64748b' };

/* ---------- Supabase ---------- */
const COLS = 'id,type,date,category,amount,memo';
const toRow = e => ({
  type: e.type === 'income' ? 'income' : 'expense',
  date: String(e.date).slice(0, 10),
  category: String(e.category || '기타').slice(0, 20),
  amount: Math.round(Number(e.amount)),
  memo: String(e.memo || '').slice(0, 40)
});
const fromRow = r => ({ ...r, amount: Number(r.amount) });

async function fetchAll() {
  const all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await db.from(TABLE).select(COLS).order('date').order('id').range(from, from + 999);
    if (error) throw error;
    all.push(...data.map(fromRow));
    if (data.length < 1000) return all;
  }
}
async function insertMany(list) {
  const rows = list.map(toRow).filter(r => r.amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(r.date));
  const out = [];
  for (let i = 0; i < rows.length; i += 500) {
    const { data, error } = await db.from(TABLE).insert(rows.slice(i, i + 500)).select(COLS);
    if (error) throw error;
    out.push(...data.map(fromRow));
  }
  return out;
}
async function deleteAll() {
  const { error } = await db.from(TABLE).delete().gt('id', 0);
  if (error) throw error;
}
function fail(err) {
  console.error(err);
  toast('저장소 연결에 실패했어요: ' + (err.message || err));
  setStatus('연결 오류', true);
}
function setStatus(text, bad) {
  $('syncStatus').textContent = text;
  $('syncStatus').style.color = bad ? 'var(--expense)' : '';
}

let entries = [];
let viewDate = new Date(); viewDate.setDate(1);
let type = 'expense';
let category = CATS.expense[0].n;
let filter = 'all';
let selectedWeek = null;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- Form ---------- */
function renderCatGrid() {
  $('catGrid').innerHTML = CATS[type].map(c => `
    <button type="button" class="cat-btn ${c.n === category ? 'on' : ''}" data-cat="${c.n}" style="--c:${c.c}">
      <span class="ic">${c.i}</span>${c.n}
    </button>`).join('');
}
$('segment').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  type = b.dataset.type; category = CATS[type][0].n;
  [...$('segment').children].forEach(x => x.classList.toggle('on', x === b));
  renderCatGrid();
});
$('catGrid').addEventListener('click', e => {
  const b = e.target.closest('.cat-btn'); if (!b) return;
  category = b.dataset.cat; renderCatGrid();
});
$('amount').addEventListener('input', e => {
  const digits = e.target.value.replace(/[^\d]/g, '').replace(/^0+/, '').slice(0, 12);
  e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
});
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const amount = Number($('amount').value.replace(/[^\d]/g, ''));
  if (!amount) { $('amount').focus(); return; }
  const date = $('date').value || ymd(new Date());
  const btn = e.target.querySelector('.submit');
  btn.disabled = true;
  try {
    const [row] = await insertMany([{ type, date, category, amount, memo: $('memo').value.trim() }]);
    entries.push(row);
  } catch (err) { fail(err); return; }
  finally { btn.disabled = false; }
  const d = parse(date);
  viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
  selectedWeek = null;
  $('amount').value = ''; $('memo').value = '';
  render();
  toast(`${catInfo(type, category).i} ${won(amount)} ${type === 'income' ? '수입' : '지출'} 추가됨`);
});

/* ---------- Weeks ---------- */
function weeksOfMonth(first) {
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  let start = addDays(first, -((first.getDay() + 6) % 7)); // 월요일 시작
  const weeks = [];
  while (start <= last) { weeks.push(start); start = addDays(start, 7); }
  return weeks;
}
function sumRange(from, to, t) {
  const a = ymd(from), b = ymd(to);
  return entries.filter(e => e.type === t && e.date >= a && e.date <= b).reduce((s, e) => s + e.amount, 0);
}

function renderWeeks() {
  const weeks = weeksOfMonth(viewDate);
  const todayStr = ymd(new Date());
  if (selectedWeek === null || selectedWeek >= weeks.length) {
    const idx = weeks.findIndex(w => todayStr >= ymd(w) && todayStr <= ymd(addDays(w, 6)));
    selectedWeek = idx >= 0 ? idx : 0;
  }
  const data = weeks.map(w => ({ w, inc: sumRange(w, addDays(w, 6), 'income'), exp: sumRange(w, addDays(w, 6), 'expense') }));
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  $('weeks').innerHTML = data.map((d, i) => {
    const end = addDays(d.w, 6);
    return `<button class="week ${i === selectedWeek ? 'on' : ''}" data-i="${i}">
      <div class="bars">
        <div class="bar inc" style="height:${d.inc / max * 100}%" title="수입 ${won(d.inc)}"></div>
        <div class="bar exp" style="height:${d.exp / max * 100}%" title="지출 ${won(d.exp)}"></div>
      </div>
      <div class="wl">${i + 1}주</div>
      <div class="wr">${d.w.getMonth() + 1}/${d.w.getDate()}~${end.getMonth() + 1}/${end.getDate()}</div>
    </button>`;
  }).join('');

  // 선택 주 상세
  const ws = weeks[selectedWeek], we = addDays(ws, 6);
  const exp = sumRange(ws, we, 'expense'), inc = sumRange(ws, we, 'income');
  const prev = sumRange(addDays(ws, -7), addDays(ws, -1), 'expense');
  let cmp = '<span style="color:var(--muted)">-</span>';
  if (prev > 0) {
    const pct = Math.round((exp - prev) / prev * 100);
    cmp = pct === 0 ? '변동 없음' : `<span class="${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span>`;
  }
  $('weekStats').innerHTML = `
    <div class="stat"><div class="k">${selectedWeek + 1}주차 지출</div><div class="v" style="color:var(--expense)">${won(exp)}</div></div>
    <div class="stat"><div class="k">${selectedWeek + 1}주차 수입</div><div class="v" style="color:var(--income)">${won(inc)}</div></div>
    <div class="stat"><div class="k">하루 평균 지출</div><div class="v">${won(Math.round(exp / 7))}</div></div>
    <div class="stat"><div class="k">지난주 대비</div><div class="v">${cmp}</div></div>`;

  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const dayExp = days.map(d => sumRange(d, d, 'expense'));
  const dmax = Math.max(1, ...dayExp);
  $('days').innerHTML = days.map((d, i) => `
    <div class="day ${ymd(d) === todayStr ? 'today' : ''} ${d.getMonth() !== viewDate.getMonth() ? 'out' : ''}" title="${d.getMonth() + 1}/${d.getDate()} 지출 ${won(dayExp[i])}">
      <div class="track"><div class="fill" style="height:${dayExp[i] / dmax * 100}%"></div></div>
      <div class="dl">${DOW[d.getDay()]} ${d.getDate()}</div>
    </div>`).join('');
}
$('weeks').addEventListener('click', e => {
  const b = e.target.closest('.week'); if (!b) return;
  selectedWeek = Number(b.dataset.i); renderWeeks();
});

/* ---------- Main render ---------- */
function render() {
  const mk = `${viewDate.getFullYear()}-${pad(viewDate.getMonth() + 1)}`;
  $('monthLabel').textContent = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
  $('heroLabel').textContent = `${viewDate.getMonth() + 1}월 잔액`;

  const month = entries.filter(e => e.date.startsWith(mk));
  const inc = month.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const exp = month.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  $('sumIncome').textContent = won(inc);
  $('sumExpense').textContent = won(exp);
  $('sumBalance').textContent = (inc - exp < 0 ? '-' : '') + won(Math.abs(inc - exp));

  renderWeeks();

  // 카테고리
  const by = {};
  month.filter(e => e.type === 'expense').forEach(e => by[e.category] = (by[e.category] || 0) + e.amount);
  const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
  $('catTotal').textContent = exp ? `총 ${won(exp)}` : '';
  $('cats').innerHTML = cats.length ? `
    <div class="stack">${cats.map(([n, v]) => `<div style="width:${v / exp * 100}%;background:${catInfo('expense', n).c}" title="${n}"></div>`).join('')}</div>
    <div class="cat-rows">${cats.map(([n, v]) => { const c = catInfo('expense', n); return `
      <div class="cat-row" style="--c:${c.c}">
        <div class="chip">${c.i}</div>
        <div class="mid">
          <div class="top"><span>${esc(n)}<small>${Math.round(v / exp * 100)}%</small></span><span>${won(v)}</span></div>
          <div class="track"><div class="fill" style="width:${v / cats[0][1] * 100}%"></div></div>
        </div>
      </div>`; }).join('')}</div>`
    : '<div class="empty"><div class="e">📊</div>이번 달 지출 내역이 없어요</div>';

  // 내역 (날짜별 그룹)
  const shown = month.filter(e => filter === 'all' || e.type === filter)
    .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const groups = {};
  shown.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  $('list').innerHTML = shown.length ? Object.entries(groups).map(([date, items]) => {
    const d = parse(date);
    const net = items.reduce((s, e) => s + (e.type === 'income' ? e.amount : -e.amount), 0);
    return `<div class="day-group">
      <div class="day-head"><span>${d.getDate()}일 ${DOW[d.getDay()]}요일</span><span>${net >= 0 ? '+' : '-'}${won(Math.abs(net))}</span></div>
      ${items.map(e => { const c = catInfo(e.type, e.category); return `
        <div class="item">
          <div class="chip" style="--c:${c.c}">${c.i}</div>
          <div class="info"><div class="t">${esc(e.memo || e.category)}</div><div class="s">${esc(e.category)}</div></div>
          <div class="amt ${e.type}">${e.type === 'income' ? '+' : '-'}${won(e.amount)}</div>
          <button class="del" data-id="${e.id}" title="삭제">✕</button>
        </div>`; }).join('')}
    </div>`;
  }).join('') : '<div class="empty"><div class="e">📝</div>내역이 없어요</div>';
}

$('filter').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('filter').children].forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('list').addEventListener('click', async e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirm('이 내역을 삭제할까요?')) return;
  const id = Number(b.dataset.id);
  const { error } = await db.from(TABLE).delete().eq('id', id);
  if (error) return fail(error);
  entries = entries.filter(x => x.id !== id);
  render(); toast('삭제했어요');
});
$('prev').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() - 1); selectedWeek = null; render(); });
$('next').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() + 1); selectedWeek = null; render(); });

/* ---------- Data tools ---------- */
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('exportBtn').addEventListener('click', () => download(`가계부_${ymd(new Date())}.json`, JSON.stringify(entries, null, 2), 'application/json'));
$('csvBtn').addEventListener('click', () => {
  const rows = [['날짜', '구분', '카테고리', '금액', '메모']].concat(
    [...entries].sort((a, b) => a.date.localeCompare(b.date))
      .map(e => [e.date, e.type === 'income' ? '수입' : '지출', e.category, e.amount, `"${(e.memo || '').replace(/"/g, '""')}"`]));
  download(`가계부_${ymd(new Date())}.csv`, '﻿' + rows.map(r => r.join(',')).join('\n'), 'text/csv');
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    if (!confirm(`${data.length}건을 불러옵니다. 기존 데이터는 대체돼요. 계속할까요?`)) return;
    await deleteAll();
    entries = await insertMany(data);
    render(); toast('불러오기 완료');
  } catch (err) {
    if (err instanceof SyntaxError || err === 0) alert('올바른 가계부 JSON 파일이 아니에요.');
    else fail(err);
  }
  finally { e.target.value = ''; }
});
$('clearBtn').addEventListener('click', async () => {
  if (!confirm('모든 내역을 삭제할까요? 되돌릴 수 없어요.')) return;
  try { await deleteAll(); } catch (err) { return fail(err); }
  entries = []; render(); toast('전체 삭제했어요');
});

// 예전에 이 브라우저(localStorage)에 저장한 내역이 있으면 한 번 옮겨 줌
async function migrateLocal() {
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch {}
  if (!Array.isArray(local) || !local.length) return;
  if (!confirm(`이 브라우저에 저장된 예전 내역 ${local.length}건이 있어요. 서버로 옮길까요?`)) return;
  entries.push(...await insertMany(local));
  try { localStorage.removeItem(LOCAL_KEY); } catch {}
  toast(`${local.length}건을 옮겼어요`);
}

async function init() {
  $('date').value = ymd(new Date());
  renderCatGrid();
  render();
  try {
    entries = await fetchAll();
    await migrateLocal();
    setStatus('Supabase에 저장돼요');
  } catch (err) { fail(err); }
  render();
}
init();
</script>
